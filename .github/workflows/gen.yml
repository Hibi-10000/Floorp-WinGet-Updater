name: Generate Stable Manifest

on:
  workflow_dispatch:
    inputs:
      tag-version:
        description: 'Tag Version (e.g., 12.6.0)'
        type: string
        required: true
      version:
        description: 'Version (e.g., 12.6.0@145.0.1)'
        type: string
        required: false
      releasenote-url-version:
        description: 'Release Note URL Version'
        type: string
        required: false
  workflow_call:
    inputs:
      tag-version:
        type: string
        required: true
      version:
        type: string
        required: false
      releasenote-url-version:
        type: string
        required: false
    outputs:
      version:
        value: ${{ jobs.generate.outputs.version }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get Version
        id: version
        run: |
          echo "version=$( \
            curl -L \
              -H "Accept: application/json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://github.com/Floorp-Projects/Floorp/releases/download/v${{ inputs.tag-version }}/win-meta.json \
            | jq -r '.version_display' \
          )" >> $GITHUB_OUTPUT

      - name: Get SHA256
        id: sha256
        run: |
          curl -fOL https://github.com/Floorp-Projects/Floorp/releases/download/v${{ inputs.tag-version }}/floorp-windows-x86_64.installer.exe
          echo "sha256-x64=$(sha256sum floorp-windows-x86_64.installer.exe | cut -c 1-64 | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT

      - name: Get ReleaseDate
        id: date
        run: |
          echo "releasedate=$( \
            curl -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ github.token }}" \
              https://api.github.com/repos/Floorp-Projects/Floorp/releases/tags/v${{ inputs.tag-version }} \
            | jq -r '.published_at' \
            | cut -c 1-10 \
          )" >> $GITHUB_OUTPUT

      - name: Replace
        run: |
          sed -i 's/${version}/${{ inputs.version || steps.version.outputs.version }}/g' ./stable/Ablaze.Floorp.installer.yaml
          sed -i 's/${version}/${{ inputs.version || steps.version.outputs.version }}/' ./stable/Ablaze.Floorp.locale.en-US.yaml
          sed -i 's/${version}/${{ inputs.version || steps.version.outputs.version }}/' ./stable/Ablaze.Floorp.locale.ja-JP.yaml
          sed -i 's/${version}/${{ inputs.version || steps.version.outputs.version }}/' ./stable/Ablaze.Floorp.yaml
          sed -i 's/${releasedate}/${{ steps.date.outputs.releasedate }}/' ./stable/Ablaze.Floorp.installer.yaml
          sed -i 's/${tagversion}/${{ inputs.tag-version }}/g' ./stable/Ablaze.Floorp.installer.yaml
          sed -i 's/${x64sha}/${{ steps.sha256.outputs.sha256-x64 }}/' ./stable/Ablaze.Floorp.installer.yaml
          sed -i 's/${version-releasenote}/${{ inputs.releasenote-url-version || inputs.tag-version }}/' ./stable/Ablaze.Floorp.locale.en-US.yaml
          sed -i 's/${version-releasenote}/${{ inputs.releasenote-url-version || inputs.tag-version }}/' ./stable/Ablaze.Floorp.locale.ja-JP.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: |
            ./stable/Ablaze.Floorp.installer.yaml
            ./stable/Ablaze.Floorp.locale.*.yaml
            ./stable/Ablaze.Floorp.yaml
